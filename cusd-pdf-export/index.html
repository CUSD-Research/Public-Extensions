
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>CUSD PDF Export</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <div class="wrap">

    <button
      id="downloadBtn"
      class="cusd-icon-btn"
      type="button"
      title="Download to PDF"
      aria-label="Download to PDF"
      disabled
    >
      <img
        src="./icon.png"
        alt=""
        class="btn-glyph"
        style="object-fit: contain;"
      >
    </button>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite">
    </div>

  </div>

  <script src="./lib/tableau.extensions.1.latest.min.js"></script>
  <script src="./pdf-export.js"></script>

</body>
</html>
