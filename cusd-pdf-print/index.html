<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CUSD PDF Print</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <!-- The in-dashboard view: just the PDF button and a transient status line. -->
  <div class="wrap" id="wrap">
    <button id="pdfBtn" class="cusd-icon-btn" type="button" title="Print this dashboard to PDF" aria-label="Print this dashboard to PDF">
      <!-- The button face is the same artwork as icon.svg: a trace of the PDF icon
           already used on CUSD dashboards (reference/assets/tableau-icons/Grey
           Modern/PDF Icon.png), on the same 47x79 grid as the Excel, Help, Close
           and Filters icons so it sits with them. Transparent background (no bg
           rect). viewBox + preserveAspectRatio="xMidYMid meet" fit and centre it,
           so you resize the icon by resizing the object on the dashboard. The
           accessible label lives on the button's title/aria-label. -->
      <svg class="btn-glyph" viewBox="0 0 47 79" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true" focusable="false">
        <path d="M2 14 H32.5 L45 28 V60.5 H2 Z" fill="#9F9F9F"/>
        <path d="M30 14 H32.5 L45 28 H30 Z" fill="#D9D9D9"/>
        <rect x="8" y="28" width="31" height="2" fill="#D9D9D9"/>
        <rect x="8" y="35" width="31" height="2" fill="#D9D9D9"/>
        <rect x="8" y="42" width="31" height="2" fill="#D9D9D9"/>
        <rect x="8" y="49" width="31" height="2" fill="#D9D9D9"/>
        <text x="23.5" y="74.5" text-anchor="middle" font-family="Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="13.5" fill="#414141">PDF</text>
      </svg>
    </button>
    <!-- Empty at rest (icon only); shows transient progress or an error. -->
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <!--
    The Tableau Extensions API is vendored locally (no runtime CDN) so nothing is
    fetched from the public internet while the dashboard is open. This extension
    has no third-party library at all: it reads dashboard METADATA (filter and
    parameter selections, the dashboard's size and name) and opens a window on
    its own host. It never calls getSummaryDataAsync, so no data rows are read,
    and no district data reaches the host. See README > Deploy.
      ./lib/tableau.extensions.1.latest.min.js  (add at hosting time -- see README)
  -->
  <script src="./lib/tableau.extensions.1.latest.min.js"></script>
  <script src="./print-url.js"></script>
  <script src="./pdf-print.js"></script>
</body>
</html>
