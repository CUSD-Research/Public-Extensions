<?xml version="1.0" encoding="utf-8"?>
<!-- Master icon for the CUSD PDF Print extension.

     This is not a new drawing. It is a trace of the PDF icon already used on CUSD
     dashboards, reference/assets/tableau-icons/Grey Modern/PDF Icon.png, which is
     itself already on the SAME 47x79 grid as the Excel icon that seeded
     cusd-excel-export/icon.svg. So the toolbar set stays consistent:
     Filters / Close / Excel / Help / PDF.

     Geometry read off the master PNG pixel by pixel:
       page body   #9F9F9F  x 2 to 45, y 14 to 60.5, top-right corner cut away
       fold flap   #D9D9D9  crease vertical at x30, horizontal at y28
       text lines  #D9D9D9  x 8, width 31, height 2, at y 28 / 35 / 42 / 49
       label       #414141  "PDF", Arial Bold 13.5, centred, baseline y74.5

     Background is TRANSPARENT (no background rect; the svg itself is fill="none")
     so the 70x70 manifest PNG composites onto a transparent canvas like the others.

     The label is a text element, so the rasteriser must resolve Arial or its
     metric twin Liberation Sans, NOT DejaVu Sans, which is wider and overflows the
     47-wide canvas. See .claude/skills/cusd-tableau-extensions/icon-design.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="47" height="79" viewBox="0 0 47 79" fill="none" role="img" aria-label="Print to PDF">
  <path d="M2 14 H32.5 L45 28 V60.5 H2 Z" fill="#9F9F9F"/>
  <path d="M30 14 H32.5 L45 28 H30 Z" fill="#D9D9D9"/>
  <rect x="8" y="28" width="31" height="2" fill="#D9D9D9"/>
  <rect x="8" y="35" width="31" height="2" fill="#D9D9D9"/>
  <rect x="8" y="42" width="31" height="2" fill="#D9D9D9"/>
  <rect x="8" y="49" width="31" height="2" fill="#D9D9D9"/>
  <text x="23.5" y="74.5" text-anchor="middle" font-family="Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="13.5" fill="#414141">PDF</text>
</svg>
